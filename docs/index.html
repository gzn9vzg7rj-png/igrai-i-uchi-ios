<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#72cf53">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Играй и учи">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<title>Играй и учи</title>
<style>
:root{--ink:#24402e;--shadow:0 12px 30px rgba(25,70,50,.16)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:#9be4ff}
button{font:inherit;cursor:pointer}
.app{min-height:100vh;padding:max(12px,env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));background:radial-gradient(circle at 12% 10%,rgba(255,255,255,.88) 0 5%,transparent 5.5%),radial-gradient(circle at 84% 13%,rgba(255,255,255,.72) 0 7%,transparent 7.5%),linear-gradient(#86dcff 0 57%,#9de265 57% 100%)}
.hidden{display:none!important}.topbar{display:flex;justify-content:flex-end}.round{border:0;background:rgba(255,255,255,.9);width:50px;height:50px;border-radius:50%;box-shadow:var(--shadow);font-size:22px}.hero{text-align:center;margin-top:-12px}.mascot{width:118px;height:118px;margin:0 auto;animation:bob 1.8s ease-in-out infinite alternate}h1{font-size:44px;line-height:.95;margin:7px 0 6px;font-weight:950;letter-spacing:-1.4px}.hero p{font-size:20px;font-weight:850;margin:0 0 22px}.menu{display:grid;gap:13px;max-width:620px;margin:0 auto}.mode{border:0;border-radius:26px;min-height:94px;padding:14px 17px;display:flex;align-items:center;gap:15px;text-align:left;color:#fff;box-shadow:var(--shadow);touch-action:manipulation}.mode:active{transform:scale(.98)}.bubble{width:64px;height:64px;border-radius:20px;background:rgba(255,255,255,.22);display:grid;place-items:center;font-size:31px;flex:0 0 auto}.mode strong{display:block;font-size:24px}.mode small{display:block;font-size:14px;font-weight:750;opacity:.97;margin-top:2px}.colors{background:linear-gradient(135deg,#ff6073,#ff8956)}.shapes{background:linear-gradient(135deg,#279cf5,#3a75e7)}.animals{background:linear-gradient(135deg,#49c958,#27a843)}.mixed{background:linear-gradient(135deg,#a75cff,#7e45e6)}.footer{text-align:center;margin-top:18px;font-size:12px;font-weight:850;color:#3c6944}.game{max-width:650px;margin:0 auto}.gameHeader{display:flex;align-items:center;justify-content:space-between}.badge{background:rgba(255,255,255,.9);padding:11px 14px;border-radius:999px;font-weight:900;box-shadow:var(--shadow)}.prompt{margin:18px 0 14px;background:rgba(255,255,255,.94);border-radius:27px;padding:18px 14px;text-align:center;box-shadow:var(--shadow)}.prompt h2{font-size:29px;margin:0 0 12px}.speak{border:0;border-radius:999px;padding:11px 17px;background:#e5f3ff;color:#1266a8;font-weight:900}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.choice{border:0;background:#fffdf9;border-radius:28px;min-height:170px;padding:13px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;touch-action:manipulation}.choice:active{transform:scale(.96)}.choice.good{outline:6px solid #58d05e}.choice.bad{outline:6px solid #ff9a34;animation:shake .28s}.symbol{font-size:78px;font-weight:900;line-height:1}.dot{width:94px;height:94px;border-radius:50%;box-shadow:inset 0 -8px 15px rgba(0,0,0,.09)}.animalSvg{width:112px;height:112px}.label{font-size:21px;font-weight:950;margin-top:9px}.feedback{text-align:center;height:48px;font-size:29px;font-weight:950;padding-top:10px}.overlay{position:fixed;inset:0;background:rgba(25,70,55,.2);display:grid;place-items:center;padding:20px;z-index:20}.popup{background:white;border-radius:34px;padding:34px 30px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.25);max-width:390px;width:100%}.popup .party{font-size:60px;animation:pop .55s ease-in-out infinite alternate}.popup h2{font-size:42px;margin:7px 0}.popup p{font-size:20px;font-weight:800}.settings{position:fixed;inset:0;background:rgba(20,60,50,.25);display:grid;align-items:end;z-index:25}.sheet{background:#fff;border-radius:30px 30px 0 0;padding:23px 20px calc(24px + env(safe-area-inset-bottom));max-width:650px;width:100%;margin:0 auto}.sheet h2{margin:0 0 18px}.row{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #eee;padding:14px 0;font-weight:850}.segment{display:flex;gap:6px}.segment button{border:0;border-radius:12px;padding:8px 12px;font-weight:900}.segment button.on{background:#daf0ff;color:#1166a8}.done{width:100%;border:0;border-radius:18px;background:#51c75a;color:white;padding:14px;font-size:18px;font-weight:950;margin-top:18px}.install{max-width:620px;margin:16px auto 0;background:rgba(255,255,255,.72);padding:12px 14px;border-radius:18px;font-size:13px;font-weight:800;text-align:center}@keyframes bob{from{transform:translateY(4px) rotate(-2deg)}to{transform:translateY(-5px) rotate(2deg)}}@keyframes shake{0%,100%{transform:translateX(0)}35%{transform:translateX(-5px)}70%{transform:translateX(5px)}}@keyframes pop{from{transform:scale(.9)}to{transform:scale(1.12)}}@media(min-width:720px){.menu{grid-template-columns:1fr 1fr}.grid{gap:16px}.choice{min-height:190px}}
</style>
</head>
<body>
<div class="app"><section id="home"><div class="topbar"><button id="settingsBtn" class="round" aria-label="Настройки">⚙️</button></div><div class="hero"><div id="heroMascot" class="mascot"></div><h1>Играй и учи</h1><p>Избери игра</p></div><div class="menu"><button class="mode colors" data-mode="colors"><span class="bubble">🎨</span><span><strong>Цветове</strong><small>Открий правилния цвят</small></span></button><button class="mode shapes" data-mode="shapes"><span class="bubble">🔺</span><span><strong>Форми</strong><small>Познай правилната форма</small></span></button><button class="mode animals" data-mode="animals"><span class="bubble">🐾</span><span><strong>Животни</strong><small>Познай животното</small></span></button><button class="mode mixed" data-mode="mixed"><span class="bubble">⭐</span><span><strong>Смесена игра</strong><small>Всичко заедно</small></span></button></div><div class="install">На iPhone: Safari → Share → Add to Home Screen</div><div class="footer">Без реклами • Без регистрация • Работи офлайн • Български глас</div></section><section id="game" class="game hidden"><div class="gameHeader"><button id="back" class="round" aria-label="Назад">←</button><div id="modeTitle" class="badge">Игра</div><div class="badge">⭐ <span id="stars">0</span></div></div><div class="prompt"><h2 id="promptText">Натисни...</h2><button id="repeat" class="speak">🔊 Чуй отново</button></div><div id="grid" class="grid"></div><div id="feedback" class="feedback"></div></section></div>
<div id="celebrate" class="overlay hidden"><div class="popup"><div class="party">🎉 ⭐ 🎉</div><h2>Браво!</h2><p id="celebrateText">Събра 5 звездички!</p></div></div><div id="settings" class="settings hidden"><div class="sheet"><h2>Настройки за родител</h2><div class="row"><span>Брой отговори</span><span class="segment"><button data-count="2">2</button><button data-count="3">3</button><button data-count="4">4</button></span></div><div class="row"><span>Български глас</span><button id="voiceToggle" class="speak">Включен</button></div><div class="row"><span>Без реклами</span><span>✅</span></div><div class="row"><span>Работи офлайн</span><span>✅</span></div><button id="done" class="done">Готово</button></div></div>
<script>
const animalSVG={lion:`<svg class="animalSvg" viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="50" fill="#f5a623"/><circle cx="60" cy="60" r="38" fill="#ffd06a"/><circle cx="45" cy="53" r="4" fill="#2b2b2b"/><circle cx="75" cy="53" r="4" fill="#2b2b2b"/><ellipse cx="60" cy="69" rx="12" ry="9" fill="#fff1c7"/><path d="M55 66 Q60 72 65 66" stroke="#5a3a23" stroke-width="4" fill="none" stroke-linecap="round"/><circle cx="30" cy="34" r="12" fill="#f5a623"/><circle cx="90" cy="34" r="12" fill="#f5a623"/></svg>`,dog:`<svg class="animalSvg" viewBox="0 0 120 120" aria-hidden="true"><ellipse cx="35" cy="40" rx="17" ry="30" fill="#9b663f"/><ellipse cx="85" cy="40" rx="17" ry="30" fill="#9b663f"/><circle cx="60" cy="61" r="42" fill="#c98b56"/><circle cx="45" cy="55" r="4" fill="#222"/><circle cx="75" cy="55" r="4" fill="#222"/><ellipse cx="60" cy="72" rx="14" ry="11" fill="#f5dfc5"/><circle cx="60" cy="68" r="6" fill="#2d211b"/><path d="M53 78 Q60 85 67 78" stroke="#603d2d" stroke-width="4" fill="none" stroke-linecap="round"/></svg>`,cat:`<svg class="animalSvg" viewBox="0 0 120 120" aria-hidden="true"><path d="M24 42 L32 12 L50 34" fill="#f2a35f"/><path d="M96 42 L88 12 L70 34" fill="#f2a35f"/><circle cx="60" cy="62" r="43" fill="#f2a35f"/><circle cx="45" cy="55" r="5" fill="#2f8a57"/><circle cx="75" cy="55" r="5" fill="#2f8a57"/><path d="M54 68 L60 73 L66 68 Z" fill="#e27676"/><path d="M60 73 Q52 80 47 77 M60 73 Q68 80 73 77" stroke="#75422e" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M34 69 H50 M31 76 H48 M70 69 H86 M72 76 H89" stroke="#75422e" stroke-width="2"/></svg>`,elephant:`<svg class="animalSvg" viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="59" r="40" fill="#a9b5c3"/><ellipse cx="23" cy="59" rx="22" ry="31" fill="#c1cad4"/><ellipse cx="97" cy="59" rx="22" ry="31" fill="#c1cad4"/><circle cx="47" cy="53" r="4" fill="#242424"/><circle cx="73" cy="53" r="4" fill="#242424"/><path d="M59 66 C59 84 56 98 67 102 C76 105 80 96 74 92" stroke="#8d9aaa" stroke-width="12" fill="none" stroke-linecap="round"/><path d="M48 73 Q60 81 72 73" stroke="#687786" stroke-width="3" fill="none" stroke-linecap="round"/></svg>`};
document.getElementById('heroMascot').innerHTML=animalSVG.lion;
const modes={colors:{title:"Цветове",items:[{label:"Червено",spoken:"червено",type:"color",value:"#f44336"},{label:"Синьо",spoken:"синьо",type:"color",value:"#1976f3"},{label:"Зелено",spoken:"зелено",type:"color",value:"#34b64d"},{label:"Жълто",spoken:"жълто",type:"color",value:"#ffd93d"},{label:"Оранжево",spoken:"оранжево",type:"color",value:"#ff8c2e"},{label:"Лилаво",spoken:"лилаво",type:"color",value:"#9d52df"}],prompt:x=>`Натисни ${x.spoken}.`},shapes:{title:"Форми",items:[{label:"Кръг",spoken:"кръга",type:"shape",value:"●",color:"#1976f3"},{label:"Квадрат",spoken:"квадрата",type:"shape",value:"■",color:"#34b64d"},{label:"Триъгълник",spoken:"триъгълника",type:"shape",value:"▲",color:"#ff8c2e"},{label:"Звезда",spoken:"звездата",type:"shape",value:"★",color:"#ffd93d"},{label:"Сърце",spoken:"сърцето",type:"shape",value:"♥",color:"#ff5f82"},{label:"Ромб",spoken:"ромба",type:"shape",value:"◆",color:"#9d52df"}],prompt:x=>`Натисни ${x.spoken}.`},animals:{title:"Животни",items:[{label:"Куче",spoken:"кучето",type:"animal",value:"dog"},{label:"Котка",spoken:"котката",type:"animal",value:"cat"},{label:"Слон",spoken:"слона",type:"animal",value:"elephant"},{label:"Лъв",spoken:"лъва",type:"animal",value:"lion"}],prompt:x=>`Къде е ${x.spoken}?`}};
let activeMode="colors",requestedMode="colors",correct=null,locked=false;let stars=Number(localStorage.getItem("stars")||0);let count=Number(localStorage.getItem("choiceCount")||3);let voice=localStorage.getItem("voiceEnabled")!=="false";const $=id=>document.getElementById(id);const shuffle=a=>[...a].sort(()=>Math.random()-.5);
function speak(text){if(!voice||!("speechSynthesis" in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="bg-BG";u.rate=.82;u.pitch=1.03;const bg=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.toLowerCase().startsWith("bg"));if(bg)u.voice=bg;speechSynthesis.speak(u)}
function setMode(mode){requestedMode=mode;activeMode=mode==="mixed"?["colors","shapes","animals"][Math.floor(Math.random()*3)]:mode;$("home").classList.add("hidden");$("game").classList.remove("hidden");$("modeTitle").textContent=mode==="mixed"?"Смесена игра":modes[activeMode].title;round()}
function round(){if(requestedMode==="mixed")activeMode=["colors","shapes","animals"][Math.floor(Math.random()*3)];locked=false;$("feedback").textContent="";const m=modes[activeMode],pool=m.items;correct=pool[Math.floor(Math.random()*pool.length)];const opts=shuffle([correct,...shuffle(pool.filter(x=>x!==correct)).slice(0,Math.min(count-1,pool.length-1))]);const prompt=m.prompt(correct);$("promptText").textContent=prompt;$("stars").textContent=stars;const grid=$("grid");grid.innerHTML="";opts.forEach(o=>{const b=document.createElement("button");b.className="choice";b.setAttribute("aria-label",o.label);if(o.type==="color")b.innerHTML=`<div class="dot" style="background:${o.value}"></div><div class="label">${o.label}</div>`;else if(o.type==="shape")b.innerHTML=`<div class="symbol" style="color:${o.color}">${o.value}</div><div class="label">${o.label}</div>`;else b.innerHTML=`${animalSVG[o.value]}<div class="label">${o.label}</div>`;b.addEventListener("click",()=>choose(o,b));grid.appendChild(b)});setTimeout(()=>speak(prompt),250)}
function choose(o,b){if(locked)return;if(o===correct){locked=true;b.classList.add("good");stars++;localStorage.setItem("stars",stars);$("stars").textContent=stars;const praise=["Браво!","Чудесно!","Страхотно!","Точно така!"][Math.floor(Math.random()*4)];$("feedback").textContent=praise;speak(praise);if(stars%5===0){setTimeout(()=>{$("celebrateText").textContent=`Събра ${stars} звездички!`;$("celebrate").classList.remove("hidden")},350);setTimeout(()=>{$("celebrate").classList.add("hidden");round()},1800)}else setTimeout(round,950)}else{b.classList.add("bad");$("feedback").textContent="Опитай пак!";speak("Опитай отново.");setTimeout(()=>b.classList.remove("bad"),350)}}
function home(){if("speechSynthesis"in window)speechSynthesis.cancel();$("game").classList.add("hidden");$("home").classList.remove("hidden")}
function renderSettings(){document.querySelectorAll("[data-count]").forEach(b=>b.classList.toggle("on",Number(b.dataset.count)===count));$("voiceToggle").textContent=voice?"Включен":"Изключен"}
document.querySelectorAll("[data-mode]").forEach(b=>b.addEventListener("click",()=>setMode(b.dataset.mode)));$("back").onclick=home;$("repeat").onclick=()=>speak($("promptText").textContent);$("settingsBtn").onclick=()=>{$("settings").classList.remove("hidden");renderSettings()};$("done").onclick=()=>$("settings").classList.add("hidden");document.querySelectorAll("[data-count]").forEach(b=>b.onclick=()=>{count=Number(b.dataset.count);localStorage.setItem("choiceCount",count);renderSettings()});$("voiceToggle").onclick=()=>{voice=!voice;localStorage.setItem("voiceEnabled",voice);renderSettings();if(voice)speak("Здравей! Хайде да играем.")};if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js");
</script>
</body>
</html>
